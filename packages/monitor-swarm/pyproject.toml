[project]
name = "monitor-swarm-ai"
version = "0.1.0a1"
description = "Trace analyzer for instrument software -- cross-references runtime logs against spec-swarm hardware constraints"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ilya Sidorov" },
]
readme = "README.md"
keywords = ["mcp", "embedded", "instrument", "trace", "monitor", "ai", "agents", "logic-analyzer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0,<9",
    "pyyaml>=6.0,<8",
    "mcp>=1.6,<2",
    "swarmsuite-core>=0.1.0",
    "swarm-kb>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/fozzfut/swarm-suite"
Repository = "https://github.com/fozzfut/swarm-suite"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
]

[project.scripts]
monitor-swarm = "monitor_swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_swarm"]

[tool.hatch.build]
include = ["src/monitor_swarm/**/*.py", "src/monitor_swarm/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml.*", "click.*"]
ignore_missing_imports = true
